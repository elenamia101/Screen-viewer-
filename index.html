<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Screen Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Phone Screen Viewer</h1>

    <p>
      Connect two devices using the same room code.
    </p>

    <label for="roomCode">Room code</label>
    <input
      id="roomCode"
      type="text"
      placeholder="Enter a room code"
      autocomplete="off"
    >

    <div class="buttons">
      <button id="viewBtn">View a screen</button>
      <button id="shareBtn">Share my screen</button>
      <button id="disconnectBtn">Disconnect</button>
    </div>

    <p id="status">Not connected</p>

    <h2>Remote screen</h2>

    <video
      id="remoteVideo"
      autoplay
      playsinline
      controls
    ></video>

    <p class="note">
      Screen sharing requires permission on the sharing device.
      Keep your room code private.
    </p>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
